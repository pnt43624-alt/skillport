<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SkillPort">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="980" cy="60" r="120" fill="#1d4ed8" opacity="0.15"/>
  <circle cx="180" cy="260" r="140" fill="#7c3aed" opacity="0.12"/>

  <!-- port glyph -->
  <g transform="translate(90,70)" filter="url(#glow)">
    <rect x="0" y="40" width="140" height="100" rx="18" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <path d="M30 90 H90" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="30" cy="90" r="10" fill="#38bdf8"/>
    <circle cx="90" cy="90" r="10" fill="#c084fc"/>
    <path d="M110 70 L145 90 L110 110 Z" fill="#818cf8"/>
  </g>

  <text x="280" y="145" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="700">SkillPort</text>
  <text x="280" y="195" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28">Install AI agent skills once. Run them everywhere.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#cbd5e1">
    <rect x="280" y="225" width="720" height="44" rx="10" fill="#020617" stroke="#1f2937"/>
    <text x="300" y="253"><tspan fill="#34d399">$</tspan> skillport install pr-review --to claude,cursor,codex</text>
  </g>
</svg>
